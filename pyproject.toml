[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiloflo"
version = "0.1.0"
description = "Apoyo a la programacion de las lineas ITW de Mubea Florence"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
hiloflo = "hiloflo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
